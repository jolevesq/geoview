<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CanNor Human Geography Demo - Canadian Geospatial Platform Viewer</title>
    <link rel="shortcut icon" href="./favicon.ico" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="msapplication-config" content="./img/browserconfig.xml" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
    <link href="https://fonts.googleapis.com/css?family=Roboto|Montserrat:200,300,400,900|Merriweather" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="css/style.css" />
  <script src="cgpv-main.js"></script></head>

  <body>
    <div id="page-header"></div>
    <div>
      <div class="back-to-main">
        <a href="./index.html?tab=specific-demos">← Back to Main</a>
      </div>

      <div class="demo-section">
        <h4>CanNor - Human Geography Demo</h4>
        <p>Demonstration of Canadian Northern Economic Development Agency - Human Geography in GeoView</p>
      </div>
    </div>
    <div
      id="Map1"
      class="geoview-map"
      data-lang="en"
      data-config="{
        'map': {
          'interaction': 'dynamic',
          'viewSettings': {
            'projection': 3978,
            'initialView': {
              'zoomAndCenter': [6, [-120, 65]]
            }
          },
          'basemapOptions': {
            'basemapId': 'transport',
            'shaded': true,
            'labeled': true
          },
          'listOfGeoviewLayerConfig': [
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': 'f281b150-0645-48e4-9c30-01f55f93f78e'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': 'be54680b-ea62-46f3-aaa9-7644ed970aef'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '82cad281-ff7d-47b3-b2ce-9f794257e86d'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '522b07b9-78e2-4819-b736-ad9208eb1067'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '16ec36d1-b320-4dcd-b71f-94670a59095a'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '5f46f0c0-277f-479c-b34d-a1385f0fe88b'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '622a7f72-4a00-4f9e-b04f-af6551c77db3'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': 'b82096d6-81a7-4db7-b042-11e173b078ae'
          }
          ]
        },
        'components': ['overview-map', 'north-arrow'],
        'navBar': ['zoom', 'fullscreen', 'home', 'measurement'],
        'appBar': {
          'tabs': {
            'core': ['geolocator', 'legend', 'details','export']
          }
        },
        'footerBar': {
          'tabs': {
            'core': ['layers', 'time-slider', 'data-table', 'guide']
          }
        },
        'theme': 'geo.ca'
      }"
    ></div>
    <button type="button" class="collapsible">Configuration Snippet</button>
    <pre id="Map1CS" class="panel"></pre>

    <script src="codedoc.js"></script>
    <script>
      insertPageHeader();

      // initialize cgpv
      cgpv.init();

      // create snippets
      window.addEventListener('load', () => {
        createCodeSnippet();
        createConfigSnippet();
      });
    </script>
  </body>
</html>
