<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CanNor Resources Demo - Canadian Geospatial Platform Viewer</title>
    <link rel="shortcut icon" href="./favicon.ico" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="msapplication-config" content="./img/browserconfig.xml" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
    <link href="https://fonts.googleapis.com/css?family=Roboto|Montserrat:200,300,400,900|Merriweather" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="css/style.css" />
  <script src="cgpv-main.js"></script></head>

  <body>
    <div id="page-header"></div>
    <div>
      <!-- <div class="back-to-main">
        <a href="./index.html?tab=specific-demos">← Back to Main</a>
      </div> -->

      <div class="demo-section">
        <h4>CanNor - Resources Demo</h4>
        <p>Demonstration of Canadian Northern Economic Development Agency - Resources in GeoView</p>
      </div>
    </div>
    <div
      id="Map1"
      class="geoview-map"
      data-lang="en"
      data-config="{
        'map': {
          'interaction': 'dynamic',
          'viewSettings': {
            'projection': 3978,
            'initialView': {
              'zoomAndCenter': [6, [-120, 65]]
            }
          },
          'basemapOptions': {
            'basemapId': 'transport',
            'shaded': true,
            'labeled': true
          },
          'listOfGeoviewLayerConfig': [
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': 'b64179f3-ea0f-4abb-9cc5-85432fc958a0'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': 'f5f2db55-31e4-42fb-8c73-23e1c44de9b2'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '8f387c74-a5d9-46ec-9aff-32bc8e0ff3b1'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '6680f821-9a28-5fdd-025e-cb4582552478'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '9f4aacbb-42eb-be93-f0a0-9a30cf6d658f'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '69cca69f-6f5c-491d-b7d1-5035984dae3a'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '000183ed-8864-42f0-ae43-c4313a860720'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': 'feb41d0b-ce69-4d92-8143-6a2ea63398ae'
          },
          {
                'geoviewLayerType': 'geoCore',
                'geoviewLayerId': '962a2eb6-0dfe-45da-90c2-446ee4568cd2'
          }
          ]
        },
        'components': ['overview-map', 'north-arrow'],
        'navBar': ['zoom', 'fullscreen', 'home', 'measurement'],
        'appBar': {
          'tabs': {
            'core': ['geolocator', 'legend', 'details','export']
          }
        },
        'footerBar': {
          'tabs': {
            'core': ['layers', 'time-slider', 'data-table', 'guide']
          }
        },
        'theme': 'geo.ca'
      }"
    ></div>
    <button type="button" class="collapsible">Configuration Snippet</button>
    <pre id="Map1CS" class="panel"></pre>

    <script src="codedoc.js"></script>
    <script>
      // insertPageHeader();

      // initialize cgpv
      cgpv.init();

      // create snippets
      window.addEventListener('load', () => {
        createCodeSnippet();
        createConfigSnippet();
      });
    </script>
  </body>
</html>
